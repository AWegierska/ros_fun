services:
    ros2:
        image: awegierska/ros2_humble:lab_mobile_ROS2
        container_name: lab_mobilne_ROS2_x11
        network_mode: host  # Użycie trybu host
        volumes:
            - ./common_dir:/home/ubuntu/Desktop/common_dir
            - ./gazebo:/home/ubuntu/.gazebo
        environment:
            - RMW_IMPLEMENTATION=rmw_fastrtps_cpp  # rmw_cyclonedds_cpp lub rmw_fastrtps_cpp dla FastDDS
            - LRM_numer_stanowiska=${LRM_numer_stanowiska}
        devices:
            - /dev/dri:/dev/dri
        group_add:
            - video
            - render
        shm_size: '2g'
        privileged: true
        security_opt:
            - seccomp:unconfined
        # For NVIDIA GPUs, install NVIDIA Container Toolkit on the host and
        # enable GPU passthrough separately, for example with: gpus: all
