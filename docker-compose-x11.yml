services:
    ros2:
        image: awegierska/ros2_humble:tsr
        container_name: ros_fun_tsr_x11
        network_mode: host  # Użycie trybu host jak w branchu roboty mobilne
        volumes:
            - ./common_dir:/workspaces/ros_fun/common_dir
            - ./gazebo:/home/vscode/.gazebo
        environment:
            - DISPLAY=:5
            - LIBGL_ALWAYS_SOFTWARE=1
            - QT_X11_NO_MITSHM=1
            - TURTLEBOT3_MODEL=burger
            - RMW_IMPLEMENTATION=rmw_fastrtps_cpp  # rmw_cyclonedds_cpp lub rmw_fastrtps_cpp dla FastDDS
            - LRM_numer_stanowiska=${LRM_numer_stanowiska:-}
        devices:
            - /dev/dri:/dev/dri
        group_add:
            - video
        working_dir: /workspaces/ros_fun/common_dir
        restart: unless-stopped
        shm_size: '2g'
        privileged: true
        security_opt:
            - seccomp:unconfined
