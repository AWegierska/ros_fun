services:
    ros2:
        build:
            context: .
            dockerfile: .devcontainer/Dockerfile
        image: ros-fun-tsr-humble:latest
        container_name: ros_fun_tsr
        volumes:
            - .:/workspaces/ros_fun
            - ./gazebo:/home/vscode/.gazebo
        ports:
            - 6080:6080
        environment:
            - DISPLAY=:1
            - LIBGL_ALWAYS_SOFTWARE=1
            - QT_X11_NO_MITSHM=1
            - TURTLEBOT3_MODEL=burger
            - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
            - LRM_numer_stanowiska=${LRM_numer_stanowiska:-}
        working_dir: /workspaces/ros_fun
        shm_size: '2g'
        privileged: true
